<!DOCTYPE html>
<html>

<head>
  <title>Viestin lähetys</title>
</head>

<body>
  {% if thread %}
  <form action="/remove_thread/{{ thread.id }}" method="post">
    <p>Haluatko varmasti poistaa ketjun?</p>
    <input type="submit" name="continue" value="Jatka" />
    <input type="submit" name="cancel" value="Peruuta" />
  </form>

  {% elif message %}
  <form action="/remove_message/{{ message.id }}" method="post">
    <p>Haluatko varmasti poistaa viestin?</p>
    <input type="submit" name="continue" value="Jatka" />
    <input type="submit" name="cancel" value="Peruuta" />
  </form>
  {% endif %}
</body>
</html>
