<!DOCTYPE html>
<html>

<head>
  <title>Viestin muokkaus</title>
</head>

<body>
  {% if thread %}
  <form action="/edit_thread/{{ thread.id }}" method="post">
    <p>
      Viesti:<br />
      <textarea name="content" rows="5" cols="40">{{ thread.content }}</textarea>
    </p>
    <p>
      Kiipeilylaji:<br />
      <label><input type="radio" name="climbing_type" value="Bouldering" {% if thread.climbing_type == "Bouldering" %}checked{% endif %} required /> Bouldering</label>
      <label><input type="radio" name="climbing_type" value="Lead" {% if thread.climbing_type == "Lead" %}checked{% endif %} /> Lead</label>
      <label><input type="radio" name="climbing_type" value="Top Rope" {% if thread.climbing_type == "Top Rope" %}checked{% endif %} /> Top Rope</label>
      <label><input type="radio" name="climbing_type" value="Speed" {% if thread.climbing_type == "Speed" %}checked{% endif %} /> Speed</label>
    </p>
    <input type="submit" value="Lähetä" />
  </form>
  {% elif message %}
  <form action="/edit_message/{{ message.id }}" method="post">
    <p>
      Viesti:<br />
      <textarea name="content" rows="5" cols="40">{{ message.content }}</textarea>
    </p>
    <input type="submit" value="Lähetä" />
  </form>
  {% endif %}
</body>

</html>
