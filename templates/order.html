<!DOCTYPE html>
<html>

<head>
  <title>Order</title>
</head>

<body>
  <form action="/result" method="post">
    <p>Choose option:</p>
    <p>
      <input type="radio" name="option" value="1" /> Bouldering
      <input type="radio" name="option" value="2" /> Lead
      <input type="radio" name="option" value="3" /> Top Rope
      <input type="radio" name="option" value="4" /> Speed
    </p>
    <p>Choose type:</p>
    <p>
      <input type="checkbox" name="type" value="S" /> Solo 
      <input type="checkbox" name="type" value="T" /> Team
    </p>
    <p>Special requests: <br />
      <textarea name="message" rows="3" cols="50"></textarea>
    </p>
    <input type="submit" value="Submit" />
  </form>
</body>

</html>
